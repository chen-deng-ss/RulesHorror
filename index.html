<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>规则怪谈解谜合集</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, "Microsoft YaHei", sans-serif;
        }
        body {
            background-color: #282c34;
            color: #e6e9ef;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            gap: 48px;
        }
        .title-area {
            text-align: center;
        }
        h1 {
            color: #c77841;
            font-weight: 500;
            letter-spacing: 2px;
            margin-bottom: 12px;
        }
        .subtitle {
            color: #a0a8b3;
            font-size: 15px;
        }
        .list-container {
            display: flex;
            flex-direction: column;
            gap: 22px;
            width: 100%;
            max-width: 360px;
        }
        .game-card {
            display: block;
            text-decoration: none;
            color: inherit;
            padding: 22px 26px;
            border: 1px solid #444a55;
            border-radius: 10px;
            background-color: #323741;
            transition: all 0.25s ease;
        }
        .game-card:hover {
            border-color: #c77841;
            background-color: #383e4a;
            transform: translateY(-3px);
        }
        .game-card h3 {
            color: #e6e9ef;
            font-size: 18px;
            margin-bottom: 8px;
            font-weight: 500;
        }
        .game-desc {
            font-size: 14px;
            color: #a0a8b3;
            line-height: 1.5;
        }
        .lock-text {
            color: #747b88;
        }
        footer {
            margin-top: 30px;
            font-size: 12px;
            color: #606773;
        }
    </style>
</head>
<body>
    <div class="title-area">
        <h1>规则怪谈解谜合集</h1>
        <div class="subtitle">认真阅读规则，理性完成每一场场景探索</div>
    </div>

    <div class="list-container">
        <!-- 已完成：西郊71路 -->
        <a href="bus71.html" class="game-card">
            <h3>西郊71路午夜公交</h3>
            <div class="game-desc">雨夜搭乘深夜公交，严格遵守候车与乘车规则，平安抵达终点站</div>
        </a>

        <!-- 已完成：猛男咖啡店 -->
        <a href="cafe.html" class="game-card">
            <h3>猛男咖啡店</h3>
            <div class="game-desc">进店消费请遵守店内告示规则，小心应对店内各色店员与客人</div>
        </a>

        <!-- 待开发关卡 -->
        <div class="game-card">
            <h3>图书馆之夜</h3>
            <div class="game-desc lock-text">开发中，敬请期待</div>
        </div>
        <div class="game-card">
            <h3>山间民宿</h3>
            <div class="game-desc lock-text">开发中，敬请期待</div>
        </div>
    </div>

    <footer>
        本内容仅为文字解谜小游戏，无真实恐怖元素
    </footer>
</body>
</html>
