<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>深夜加班守则 · 规则怪谈</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #e6e9ef;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
            font-family: 'Times New Roman', '宋体', 'SimSun', 'Microsoft YaHei', serif;
        }
        .game-container {
            max-width: 820px;
            width: 100%;
            background: #ffffff;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.12), 0 1px 4px rgba(0, 0, 0, 0.08);
            border-radius: 4px;
            padding: 48px 56px 40px;
            position: relative;
            border: 1px solid #d0d7e3;
        }
        .game-container::before {
            content: "";
            position: absolute;
            top: 12px;
            left: 48px;
            right: 48px;
            height: 2px;
            background: #e0e5ed;
            border-radius: 1px;
        }
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #3d4a5b;
            font-size: 14px;
            padding-bottom: 18px;
            margin-bottom: 20px;
            border-bottom: 1px solid #d0d7e3;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            font-weight: 400;
            letter-spacing: 0.3px;
            flex-wrap: wrap;
            gap: 6px 16px;
        }
        .status-bar .scene-label {
            font-weight: 600;
            color: #1a2a3a;
            font-size: 15px;
        }
        .status-bar .time {
            color: #6b7a8b;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            background: #f2f5fa;
            padding: 2px 14px;
            border-radius: 12px;
        }
        /* ---------- 故事文本 ---------- */
        .story-text {
            color: #1e2a36;
            font-size: 17px;
            line-height: 1.85;
            min-height: 200px;
            background: #ffffff;
            padding: 8px 4px 16px;
            margin-bottom: 28px;
            white-space: pre-wrap;
            word-break: break-word;
            font-family: 'Times New Roman', '宋体', 'SimSun', 'Microsoft YaHei', serif;
            text-align: justify;
            max-height: 540px;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: #c0c8d6 #f5f7fa;
        }
        /* 正文段落：首行缩进2字符 */
        .story-text p {
            margin: 0 0 0.6em 0;
            text-indent: 2em;
        }
        .story-text p:last-child {
            margin-bottom: 0;
        }
        /* 守则模式：无缩进，每条规则左对齐 */
        .story-text.rules-mode p {
            text-indent: 0 !important;
            margin: 0.2em 0;
        }
        .story-text.rules-mode .rule-line {
            display: block;
            padding-left: 0;
            text-indent: 0;
        }
        .story-text .hl-rule {
            color: #b33c3c;
            font-weight: 600;
            background: #fcf0f0;
            padding: 0 6px;
            border-radius: 3px;
        }
        .story-text .hl-danger {
            color: #b33c3c;
            font-weight: 700;
        }
        .story-text .hl-safe {
            color: #2a7a5a;
            font-weight: 700;
        }
        .story-text .hl-glow {
            animation: glitch 1.6s infinite alternate;
        }
        @keyframes glitch {
            0% {
                opacity: 1;
                text-shadow: 0 0 1px rgba(180, 60, 60, 0.15);
            }
            100% {
                opacity: 0.88;
                text-shadow: 1px 0 rgba(180, 60, 60, 0.1), -1px 0 rgba(60, 60, 180, 0.1);
            }
        }
        .story-text .divider {
            display: block;
            text-align: center;
            color: #b0bcca;
            font-size: 14px;
            letter-spacing: 6px;
            margin: 8px 0;
        }
        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 4px;
        }
        .option-btn {
            background: #f8faff;
            border: 1px solid #d5dce8;
            color: #1a2a3a;
            padding: 14px 20px;
            border-radius: 4px;
            font-size: 16px;
            font-family: 'Times New Roman', '宋体', 'SimSun', 'Microsoft YaHei', serif;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s;
            line-height: 1.5;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.02);
            letter-spacing: 0.2px;
        }
        .option-btn:hover {
            background: #edf3ff;
            border-color: #7a8aa0;
            transform: translateX(3px);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }
        .option-btn:active {
            transform: scale(0.99);
        }
        .option-btn .hint {
            display: block;
            font-size: 14px;
            color: #6b7a8b;
            margin-top: 2px;
            font-weight: 300;
            font-style: italic;
        }
        .reset-area {
            margin-top: 28px;
            text-align: center;
            border-top: 1px solid #e0e5ed;
            padding-top: 22px;
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        .reset-btn {
            background: none;
            border: 1px solid #c8d2e0;
            color: #4b5a6e;
            padding: 8px 32px;
            border-radius: 30px;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            font-size: 14px;
            cursor: pointer;
            transition: 0.25s;
            letter-spacing: 0.4px;
            background: #fafcff;
        }
        .reset-btn:hover {
            color: #1a2a3a;
            border-color: #8a9ab0;
            background: #f0f5ff;
        }
        .reset-btn.rules-btn {
            color: #5a4a7a;
            border-color: #b0a8d0;
        }
        .reset-btn.rules-btn:hover {
            color: #3a2a5a;
            border-color: #8a78b0;
            background: #f4f0ff;
        }
        @media (max-width: 600px) {
            .game-container {
                padding: 28px 20px 30px;
            }
            .game-container::before {
                left: 20px;
                right: 20px;
            }
            .story-text {
                font-size: 16px;
                padding: 4px 0 12px;
                max-height: 400px;
            }
            .option-btn {
                font-size: 15px;
                padding: 12px 16px;
            }
            .status-bar {
                font-size: 13px;
            }
        }
    </style>
</head>
<body>
    <div class="game-container" id="app">
        <div class="status-bar">
            <div class="scene-label" id="sceneIndicator">📄 文档 · 门口</div>
            <div class="time" id="timeDisplay">23:47</div>
        </div>
        <div class="story-text" id="storyDisplay"></div>
        <div class="options-grid" id="optionsContainer"></div>
        <div class="reset-area">
            <a href="index.html" class="reset-btn">🏠 返回合集首页</a>
            <button class="reset-btn" onclick="resetGame()">⟳ 重新开始</button>
            <button class="reset-btn rules-btn" onclick="showRules()">📄 再看守则</button>
        </div>
    </div>

    <script>
        // ================================================================
        //  深夜加班守则 · 规则怪谈（排版修正版）
        //  守则页面无缩进，正文首行缩进2字符
        // ================================================================

        let currentNodeId = 'start';
        let prevNodeId = null;

        function resetGame() {
            currentNodeId = 'start';
            prevNodeId = null;
            renderNode('start');
        }

        function showRules() {
            if (currentNodeId === 'rules_display') return;
            prevNodeId = currentNodeId;
            currentNodeId = 'rules_display';
            renderNode('rules_display');
        }

        // ================================================================
        //  游戏数据（完整版）
        // ================================================================

        const gameData = {

            // ---------- 守则展示（每条规则独立一行，无缩进） ----------
            rules_display: {
                id: 'rules_display',
                text: `【深夜加班守则】

     1. 加班期间，请坐在自己的工位上。
        2. 打印机在午夜12点后如果发出声音，请继续做你的事。
        3. 茶水间的咖啡机如果发出不同于运转的声音，请对它说一句“辛苦了”，然后离开。
        4. 乘坐电梯时，如果电梯内已有乘客，请等待下一趟。
        5. 如果有人叫你的名字，不要回头。
        6. 深夜点外卖时，请明确备注你想要的餐品。
        7. 使用洗手间时，请对着镜子微笑。
        8. 如果电脑屏幕黑屏，请等待。
        9. 如果文件柜的门自己打开了，请当作没有看见。
        10. 如果门禁卡失效，请用你的工牌轻敲三下门。

        ——— 没有解释。没有警告。只是规则。 ———`,
                options: [
                    { text: '↩ 返回继续', next: 'rules_back' }
                ]
            },
            rules_back: { id: 'rules_back', text: '', options: [{ text: '继续', next: 'rules_restore' }] },
            rules_restore: { id: 'rules_restore', text: '', options: [{ text: '继续', next: 'rules_go_back' }] },

            // ---------- 开场 ----------
            start: {
                id: 'start',
                text: `晚上十一点四十七分。你还在办公室。

        窗外是沉沉的夜色，整栋写字楼只有你所在的这一层还亮着灯。空调管道里发出低沉的嗡鸣，像某种大型动物在呼吸。你的手指在键盘上机械地敲击，屏幕的光映在你疲惫不堪的脸上，把眼下的青灰色照得格外明显。

        你揉了揉酸胀的太阳穴，准备收拾东西走人——方案已经改了六遍，再改下去你就要变成第七版了。你站起来，椅子发出刺耳的摩擦声，在空旷的办公区里回荡了好几秒。

        走到门口时，你发现门把手上贴着一张崭新的A4纸，黑色加粗字体，打印得异常清晰，像是刚贴上去的。纸面还带着微弱的余温。

        你眯起眼睛，逐行扫过上面的文字：

        【深夜加班守则】

        1. 加班期间，请坐在自己的工位上。
        2. 打印机在午夜12点后如果发出声音，请继续做你的事。
        3. 茶水间的咖啡机如果发出不同于运转的声音，请对它说一句“辛苦了”，然后离开。
        4. 乘坐电梯时，如果电梯内已有乘客，请等待下一趟。
        5. 如果有人叫你的名字，不要回头。
        6. 深夜点外卖时，请明确备注你想要的餐品。
        7. 使用洗手间时，请对着镜子微笑。
        8. 如果电脑屏幕黑屏，请等待。
        9. 如果文件柜的门自己打开了，请当作没有看见。
        10. 如果门禁卡失效，请用你的工牌轻敲三下门。

        每一个字你都认识，但连在一起看，总有一股说不清道不明的违和感。像是有人在刻意隐瞒什么，又像是某种你不愿意承认的东西正在安静地等待。

        你已经连续加班三天了。如果今晚不把方案改完，明天领导开会时的脸色会比窗外的夜色还黑。

        你深吸一口气，拿起了那张纸——`,
                options: [
                    { text: 'A. 默默记住每一条规则，认真执行', next: 'enter_office' },
                    { text: 'B. 嗤笑一声，把纸条揉成团扔进垃圾桶', next: 'start_rude' },
                    { text: 'C. 用手机拍下来，留着慢慢看', next: 'enter_office' },
                    { text: 'D. 撕下纸条，折好放进口袋，决定先不管', next: 'enter_office' }
                ]
            },

            start_rude: {
                id: 'start_rude',
                text: `你冷笑了一声：“什么乱七八糟的，谁贴的？”手指一收，那张纸便皱成了一团，在空中划出一道弧线，准确落入垃圾桶。

        你拍了拍手，大步走进办公室。可就在你踏入大门的那一刻，一股突兀的凉意从脚底窜上来——空调什么时候调得这么低了？或者说，降温的并不是空调。

        你在自己的工位坐下，刚把电脑唤醒，身后就传来一声极轻的叹息。那声音很短，像是有人刚开口就闭上了嘴。你猛地回头——什么也没有。只有你那件挂在椅背上的外套，在空调风里轻轻晃了晃。

        你转回身，盯着屏幕，但总觉得暗处有一双眼睛正安静地注视着你，不催促，不逼近，只是看着。`,
                options: [
                    { text: 'A. 不管了，继续加班', next: 'enter_office' },
                    { text: 'B. 有点发毛，去垃圾桶把纸条捡回来', next: 'enter_office' },
                    { text: 'C. 站起来环顾四周，检查一下', next: 'enter_office' }
                ]
            },

            enter_office: {
                id: 'enter_office',
                text: `你重新坐回自己的工位，打开电脑。屏幕的光在昏暗的办公室中投出一小片亮区，像一扇通往另一个世界的窗口。键盘的敲击声在空旷的楼层里显得格外清晰，每一下都像是被放大了数倍。

        你下意识地瞥了一眼领导办公室——那扇门虚掩着，里面漆黑一片，像一张沉默的嘴。从门缝里漏出来的空气似乎比走廊更凉一些，你隐约能闻到一丝淡淡的、说不清的气味，像是旧纸张混合着……体温。

        你晃了晃脑袋，把注意力拉回屏幕。但规则第一条像一根细针一样扎在你意识里——“请坐在自己的工位上”。你低头看了看自己的椅子，又看了看领导那扇虚掩的门。`,
                options: [
                    { text: 'A. 乖乖坐在自己的工位，继续改方案', next: 'workstation' },
                    { text: 'B. 好奇心作祟，悄悄溜进领导办公室看看', next: 'boss_office' },
                    { text: 'C. 去泡杯咖啡提神，顺便观察一下周围', next: 'breakroom' },
                    { text: 'D. 给领导发条消息，问问他是不是落了东西', next: 'boss_office' }
                ]
            },

            boss_office: {
                id: 'boss_office',
                text: `你轻手轻脚地推开那扇虚掩的门，门轴发出细微的“吱呀”声，在安静中显得格外刺耳。月光从百叶窗的缝隙里渗进来，在地板上投下一道道平行的银白色条纹，像是某种栅栏。

        领导的那张黑色皮质办公椅就摆在办公桌后面，在月光下泛着暗沉的光泽。椅背上有一道浅浅的压痕，像是有人刚刚坐过，又像是被坐了太多次，皮质已经记住了那个形状。你注意到扶手上有一小块区域的颜色比其他地方深，像是被反复摩挲过。

        你站在门口，犹豫了几秒。里面的空气比走廊更冷，而且那股旧纸张混合体温的气味更浓了，像是这间房间本身在呼吸。`,
                options: [
                    { text: 'A. 关上门，回到自己工位', next: 'workstation' },
                    { text: 'B. 走进去，在领导椅子上坐一下', next: 'ending_boss_chair' },
                    { text: 'C. 站在门口，用手机拍一张照片', next: 'ending_boss_chair' },
                    { text: 'D. 朝里面喊一声“有人吗”', next: 'ending_boss_chair' }
                ]
            },

            ending_boss_chair: {
                id: 'ending_boss_chair',
                text: `你走了进去——或者你拍了照，或者你喊了话——总之你打破了那条规则。你坐上了那张椅子，或者触碰了不该触碰的东西。

        椅子比想象中柔软，带着一丝微弱的余温，像是有人刚刚离开。你坐下去的那一刻，椅子表面开始微微凹陷，贴合你的身形，像是一团正在冷却的蜡。你尝试站起来，却发现双腿发麻，身体像是被胶水粘在了皮质表面。你挣扎，但椅子越吸越紧，你的轮廓正在被一点一点地印进椅面。

        最后的视野里，你看到领导的办公室门在眼前缓缓合拢，月光被切断，黑暗彻底包裹了你。你听见一个遥远的声音在说：“明天坐上去的时候，会更舒服的。”

        💀 你成了领导的椅子。永远。`,
                options: [
                    { text: '💀 重新开始', next: 'start' }
                ]
            },

            workstation: {
                id: 'workstation',
                text: `你重新把注意力拉回屏幕，手指在键盘上敲击着，但那些字符像是有了自己的重量，每一个字都敲得格外沉闷。墙上时钟的秒针在安静中发出清晰的滴答声，每一声都像在提醒你时间的流逝。

        指针指向了 11:58。离午夜还有两分钟。你喝了一口已经凉透的咖啡，正准备继续，身后的打印机忽然响了一声——不是正常工作时的那种流畅的出纸声，而是一种缓慢的、犹豫的、像是纸张被一点点拖拽出来的声响。出纸口探出一角白色，像某种生物在试探着伸出触角。

        你的心跳漏了半拍。你想起规则第二条：“请继续做你的事。”但你的手指已经停在了键盘上方，视线不由自主地瞟向打印机。`,
                options: [
                    { text: 'A. 无视打印机，把视线拉回屏幕继续工作', next: 'pass_printer' },
                    { text: 'B. 忍不住走过去看看那张纸写了什么', next: 'ending_printer' },
                    { text: 'C. 站起来，走到打印机旁边但没有看纸，直接按了取消键', next: 'ending_printer' },
                    { text: 'D. 用余光偷瞄那几张纸，假装还在工作', next: 'ending_printer' }
                ]
            },

            ending_printer: {
                id: 'ending_printer',
                text: `你走了过去——或者你按了取消键，或者你用余光偷瞄了——总之你没有“继续做你的事”。

        你拿起最上面那张纸，上面只印着一行字，字体极细，像是用针尖刻上去的：“你是第三个。”你的手指微微发颤。打印机又缓缓吐出一张纸，这次是一张照片——拍摄角度是你工位的正后方，镜头里是你的背影。你猛地回头，身后空无一人。但打印机的指示灯还亮着，像一只没有合上的眼睛。

        你低头再看那张纸，字迹已经变了：“你已经看到了，那就留下来吧。”你感到后颈有一阵若有若无的呼吸，温热，很轻。然后你的额头撞上了打印机的出纸口，视野最后停留在那盏指示灯上，它像瞳孔一样慢慢收缩，收缩，直到什么也没有。

        💀 你成了打印机里的一张纸。`,
                options: [
                    { text: '💀 重新开始', next: 'start' }
                ]
            },

            pass_printer: {
                id: 'pass_printer',
                text: `你咬紧牙关，把视线硬生生扯回屏幕。手指重新开始敲击键盘，但你能感觉到身后的打印机又吐了三四张纸，每一声都像在试探你的意志。然后，声音停了。办公室恢复了安静，但那种安静比之前更深了，像是有人屏住了呼吸。

        你没有回头去看那些纸。你只是继续打字，直到手指不再发抖。空调的风似乎比刚才更冷了一些，但你裹紧了外套，没有再看那个方向。`,
                options: [
                    { text: '继续工作', next: 'breakroom' }
                ]
            },

            breakroom: {
                id: 'breakroom',
                text: `你终于改完了最后一版方案，喉咙干得像砂纸。你起身走向茶水间，走廊的声控灯在你走进时亮起，又在你身后悄悄熄灭，把你留在下一段黑暗的前沿。

            perfect_end: {
                id: 'perfect_end',
                text: `你走出大楼，夜风迎面而来。你站在街边，第一次觉得外面的空气这么安静、这么普通。你打开手机，发现HR发来一条消息：“明天不用来公司了，好好休息。你被放了一个长假。”你愣了一瞬，然后笑了——这是你入职以来收到的最好的工作消息。

        你走在回家的路上，凌晨的街道空旷而温柔。路过一个垃圾桶时，你看到里面有一张揉皱的A4纸，纸边露出来几个字：“生存守则”。你继续往前走，没有回头。

        ✨ 你活着走出了加班地狱。今夜之后，规则不再适用于你。`,
                options: [
                    { text: '🔄 重新体验', next: 'start' }
                ]
            }
        };

        // ================================================================
        //  渲染引擎（修正版：守则无缩进，正文缩进2字符）
        // ================================================================

        function renderNode(nodeId) {
            const node = gameData[nodeId];
            if (!node) {
                document.getElementById('storyDisplay').innerHTML = '<p>⚠️ 文档损坏。规则丢失。</p>';
                document.getElementById('optionsContainer').innerHTML = '';
                return;
            }

            if (nodeId === 'rules_back' || nodeId === 'rules_restore' || nodeId === 'rules_go_back') {
                if (prevNodeId && gameData[prevNodeId]) {
                    currentNodeId = prevNodeId;
                    prevNodeId = null;
                    renderNode(currentNodeId);
                } else {
                    currentNodeId = 'start';
                    renderNode('start');
                }
                return;
            }

            currentNodeId = nodeId;

            let rawText = node.text;
            // 高亮规则关键词
            rawText = rawText.replace(/【(.*?)】/g, '<span class="hl-rule">【$1】</span>');
            rawText = rawText.replace(/「(.*?)」/g, '<span class="hl-rule">「$1」</span>');
            rawText = rawText.replace(/✨/g, '<span class="hl-glow">✨</span>');
            rawText = rawText.replace(/💀/g, '<span class="hl-danger">💀</span>');

            // 按空行分割段落
            const paragraphs = rawText.split(/\n\s*\n/).filter(p => p.trim() !== '');
            const htmlContent = paragraphs.map(p => `<p>${p}</p>`).join('');

            const storyEl = document.getElementById('storyDisplay');
            storyEl.innerHTML = htmlContent;

            // 守则页面特殊处理：无缩进
            if (nodeId === 'rules_display') {
                storyEl.className = 'story-text rules-mode';
            } else {
                storyEl.className = 'story-text';
            }

            // 场景标签
            const sceneName = node.id;
            let sceneLabel = '📄 文档 · 门口';
            if (sceneName === 'rules_display') sceneLabel = '📄 守则';
            else if (sceneName === 'start' || sceneName === 'start_rude') sceneLabel = '📄 门口';
            else if (sceneName === 'enter_office') sceneLabel = '📄 办公室';
            else if (sceneName === 'boss_office' || sceneName === 'ending_boss_chair') sceneLabel = '📄 领导办公室';
            else if (sceneName === 'workstation' || sceneName === 'pass_printer' || sceneName === 'ending_printer') sceneLabel =
                '📄 工位';
            else if (sceneName === 'breakroom' || sceneName === 'pass_coffee' || sceneName === 'ending_coffee') sceneLabel =
                '📄 茶水间';
            else if (sceneName === 'elevator' || sceneName === 'safe_elevator' || sceneName === 'ending_elevator') sceneLabel =
                '📄 电梯';
            else if (sceneName === 'delivery' || sceneName === 'safe_delivery' || sceneName === 'ending_delivery') sceneLabel =
                '📄 外卖';
            else if (sceneName === 'restroom' || sceneName === 'safe_mirror' || sceneName === 'ending_mirror') sceneLabel =
                '📄 洗手间';
            else if (sceneName === 'black_screen' || sceneName === 'safe_screen' || sceneName === 'ending_screen') sceneLabel =
                '📄 电脑';
            else if (sceneName === 'cabinet' || sceneName === 'safe_cabinet' || sceneName === 'ending_cabinet') sceneLabel =
                '📄 文件柜';
            else if (sceneName === 'card_fail' || sceneName === 'safe_exit' || sceneName === 'ending_bad_exit') sceneLabel =
                '📄 大门';
            else if (sceneName === 'perfect_end') sceneLabel = '✨ 出口';
            document.getElementById('sceneIndicator').textContent = sceneLabel;

            // 时间
            const timeDisplay = document.getElementById('timeDisplay');
            if (nodeId === 'start' || nodeId === 'start_rude') timeDisplay.textContent = '23:47';
            else if (nodeId === 'enter_office' || nodeId === 'boss_office' || nodeId === 'workstation' || nodeId ===
                'pass_printer' || nodeId === 'ending_printer') timeDisplay.textContent = '23:52';
            else if (nodeId === 'breakroom' || nodeId === 'pass_coffee' || nodeId === 'ending_coffee') timeDisplay.textContent =
                '00:03';
            else if (nodeId === 'elevator' || nodeId === 'safe_elevator' || nodeId === 'ending_elevator') timeDisplay
                .textContent = '00:17';
            else if (nodeId === 'delivery' || nodeId === 'safe_delivery' || nodeId === 'ending_delivery') timeDisplay
                .textContent = '00:24';
            else if (nodeId === 'restroom' || nodeId === 'safe_mirror' || nodeId === 'ending_mirror') timeDisplay.textContent =
                '00:31';
            else if (nodeId === 'black_screen' || nodeId === 'safe_screen' || nodeId === 'ending_screen') timeDisplay
                .textContent = '00:38';
            else if (nodeId === 'cabinet' || nodeId === 'safe_cabinet' || nodeId === 'ending_cabinet') timeDisplay.textContent =
                '00:44';
            else if (nodeId === 'card_fail' || nodeId === 'safe_exit' || nodeId === 'ending_bad_exit') timeDisplay.textContent =
                '00:51';
            else if (nodeId === 'perfect_end') timeDisplay.textContent = '01:03';
            else timeDisplay.textContent = '??:??';

            // 选项
            const container = document.getElementById('optionsContainer');
            container.innerHTML = '';
            if (node.options && node.options.length > 0) {
                node.options.forEach((opt) => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.textContent = opt.text;
                    btn.addEventListener('click', function() {
                        if (gameData[opt.next]) {
                            currentNodeId = opt.next;
                            renderNode(currentNodeId);
                        } else {
                            resetGame();
                        }
                    });
                    container.appendChild(btn);
                });
            } else {
                const resetBtn = document.createElement('button');
                resetBtn.className = 'option-btn';
                resetBtn.textContent = '重新开始';
                resetBtn.addEventListener('click', resetGame);
                container.appendChild(resetBtn);
            }

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        renderNode('start');
    </script>
</body>
</html>
