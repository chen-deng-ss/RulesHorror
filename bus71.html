    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;

        body {

            position: relative;
        }

            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;

            margin-bottom: 22px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            flex-wrap: wrap;

            margin-bottom: 28px;
            max-height: 500px;
            overflow-y: auto;
        }

            text-indent: 2em;
            margin: 0 0 0.5em 0;
        }
        .story-text p:last-child {
            margin-bottom: 0;
        }
        .story-text .hl-rule {
            color: #ffaa33;
            background: rgba(255, 170, 51, 0.08);
            padding: 1px 6px;
            border-radius: 4px;
        }
        .story-text .hl-danger {
            color: #ff4d4d;
        }
        .story-text .hl-safe {
            color: #7ddf7d;
        }
        .story-text .hl-glow {
            animation: glitchText 1.2s infinite alternate;
        }
        @keyframes glitchText {
            0% {
                opacity: 1;
                text-shadow: 0 0 2px rgba(255, 0, 0, 0.3);

            100% {
                opacity: 0.85;
                text-shadow: 2px 0 rgba(255, 0, 0, 0.2), -2px 0 rgba(0, 0, 255, 0.2);

            border-color: #666;
            background: #1a1a1a;
        }
        .story-text::-webkit-scrollbar {

        }
        .story-text::-webkit-scrollbar-track {

            background: #3a3a3a;
            border-radius: 4px;
        }
        @media (max-width: 500px) {
            .game-container {
                padding: 16px;

            .story-text {
                font-size: 15px;
                padding: 14px 16px;
                max-height: 380px;
            }
            .option-btn {

                padding: 12px 14px;
            }
            .status-bar {
                font-size: 11px;
            }
        }
    </style>
</head>

    <div class="game-container" id="app">

    <script>
        // ================================================================
        //  🚌  西郊71路午夜公交站  ·  最终版（含内心活动）

        const gameData = {

            start: {
                id: 'start',
                text: `🌧️ 雨夜，你站在西郊公交总站。

        你加班到深夜，头昏脑涨，只想快点回家。暴雨从傍晚一直下到现在，站台顶棚漏雨，老旧路灯忽明忽暗，整个世界都像是泡在水里。

        你低头，看见座椅缝隙里压着一张皱巴巴的纸条，上面写着：

        「西郊总站 · 午夜候车须知」<br>
        1. 本站日间常规运营线路为 71 路，夜间会有编号杂乱的过路临时班车，建议仅搭乘 71 路公交返程。<br>
        2. 候车长椅左侧区域可短暂落座休息，尽量不要长时间倚靠、坐在长椅右侧位置，中途不要随意更换座位。<br>
        3. 若站台广播播放寻人、寻物播报，请安静原地等候，不必四处张望、主动回应广播内容。<br>
        4. 深夜站台人流稀少，请勿随意收下陌生候车乘客递来的任何物品。<br>
        5. 站牌张贴的发车时刻表仅作白天参考，夜间车辆到站时间极易错乱，不必完全依照表上时间等候。<br>
        6. 若偶遇身穿黑色雨衣的路人，不要主动抬头对视，也不要上前搭话；如果对方主动和你交谈，全程保持沉默即可。<br>
        7. 公交进站后先看清车头线路标识，文明礼让有序排队候车，切勿抢先登车。<br>
        8. 站内地下换乘通道凌晨一点整封闭停用；凌晨一点前，没有紧急需求，不要独自走进通道深处。<br>
        9. 若你的影子出现扭曲、拉长、来回晃动的异常情况，请原地静止站立，不要随意走动，等待影子恢复正常形态。

        你叹了口气，觉得这多半是某个无聊人的恶作剧——这种深夜套路，电影里看多了。但莫名地，你还是将纸条折好收进了口袋。你抬头望向远处空荡的街道，没有半点车灯的光亮。雨，却越下越大了，湿冷的风吹得你打了个寒颤。你心想：管他什么规则，先等到车再说。`,
                options: [
                    { text: '进入站台，开始候车', next: 'act1' }
                ]
            },

            act1: {
                id: 'act1',
                text: `你拖着重重的步子走进站台，浑身湿漉漉的，只想找个地方坐下。站台顶棚漏下的雨水滴答作响，老旧路灯忽明忽暗，把一切都照得模糊不清。中间那条木制长椅湿了一半，在灯光下泛着暗沉的光。

        你揉了揉太阳穴，心里嘀咕：左边还是右边？那个纸条上写的“左侧”到底是以什么方向为准？是面向马路，还是背对公交？光影交错，雨雾弥漫，根本辨不清。你环顾四周，站台上零星站着几个人，都垂着头，疲惫得像纸片人，脸色看不真切，沉默得让人发毛。

        你站在那儿，脑子里两个声音在打架——一个说：“坐一会儿吧，腿都要断了。”另一个说：“别冒险，站着最稳妥。”雨声嘈杂，你攥紧口袋里的纸条，迟迟下不了决心。`,
                options: [
                    { text: 'A. 沿站台边缘缓慢站立等候', next: 'act1_a' },
                    { text: 'B. 擦干净长椅左侧水渍，坐下休息', next: 'act1_b' },
                    { text: 'C. 直接坐在长椅潮湿的右侧区域', next: 'act1_c' }

            },
            act1_a: {
                id: 'act1_a',

                options: [
                    { text: '继续候车', next: 'act2' }
                ]
            },
            act1_b: {
                id: 'act1_b',
                text: `💀 你想：“管他什么左右，左边总该安全吧。”你擦了擦长椅左侧的水渍，一屁股坐了下去。但就在坐下的瞬间，你感觉一阵眩晕——长椅仿佛被无形的力量转动了方向，你认定的“左侧”竟变成了禁忌区。你想起身，双腿却像灌了铅。怨灵的气息从椅面渗入你的后背，你意识到自己已经被标记了。当晚所有 71 路都会跳过这个站台，你将被困在这雨夜的循环里，永远等不到回家的车。

        💀 结局：雨夜站台 · 永无止境的等候`,
                options: [
                    { text: '重新候车', next: 'start' }
                ]
            },
            act1_c: {
                id: 'act1_c',
                text: `💀 你太累了，管不了那么多，一屁股坐在了长椅的右侧。潮湿的木板冷得刺骨，你打了个哆嗦，正想抱怨，却发现身体开始僵住——你的影子像活了一样，慢慢脱离你的脚底，像黑色的水一样流向椅底。你想呼救，喉咙却发不出任何声音。你成为了这个站台永久的亡魂之一，永远坐在那张长椅上。

        💀 结局：影子剥离 · 永驻站台`,
                options: [
                    { text: '重新候车', next: 'start' }
                ]
            },

            act2: {
                id: 'act2',
                text: `你站了很久，雨还是不停，外套已经完全湿透，冷风一吹，你忍不住打了几个喷嚏。就在你低头擦脸上的雨水时，余光瞥见浓稠的雨雾里有人影在移动。你抬头，看见一个穿黑色雨衣的人撑着伞，正不紧不慢地朝你走来。奇怪的是，他的脚步一点声音都没有，仿佛飘在地面上。他走到你面前，从口袋里掏出一包未拆封的纸巾，安静地递到你面前，等着你收下。

        你愣住了。这大半夜的，荒郊野外的公交站，突然有人给你递纸巾？你心里警铃大作，想起纸条上那句“勿随意收下陌生候车乘客递来的任何物品”。可你浑身湿透，又冷得发抖，那包纸巾看起来干干净净，让人忍不住想接。你犹豫了——也许只是好心人？但为什么他的衣服一点都没湿？你咽了口唾沫，脑子飞快转着。`,
                options: [
                    { text: 'A. 假装没看见，不理睬对方', next: 'act2_a' },
                    { text: 'B. 伸手接过纸巾，拆开擦拭身上雨水', next: 'act2_b' },
                    { text: 'C. 接过纸巾拿在手中观望对方', next: 'act2_c' }
                ]
            },
            act2_a: {
                id: 'act2_a',
                text: `你偏过头，假装在看远处的路牌，完全无视那只递纸巾的手。几秒钟后，你感到那人的视线在你脸上停留了片刻，然后他缓缓收回手。你余光瞥见他的眼神变得空洞，像一具空壳，他转身，走回雨雾里，消失得无影无踪。你长舒一口气，暗自庆幸自己守住了规矩。`,
                options: [
                    { text: '继续等待', next: 'act3' }

            act2_b: {

                text: `💀 你太冷了，心想“一包纸巾而已，能有什么问题”，便接过来拆开，擦掉脸上的雨水。但纸巾接触皮肤的瞬间，一股冰寒刺骨的阴气顺着手臂钻入体内，你打了个冷战，低头一看——自己的影子开始变得透明。你惊恐地发现，自己正在一点点消失，最终化作了那些滞留亡魂的一部分。

        💀 结局：阴气入体 · 同化亡魂`,
                options: [
                    { text: '重新候车', next: 'start' }
                ]
            },
            act2_c: {
                id: 'act2_c',
                text: `💀 你犹豫了一下，还是伸手接过了纸巾，但不敢拆开，只是握在手里。那包纸巾冰冷得像块冰，你捏着它，心里越来越不安。你抬头想看看那人的表情，却发现他已经退到了雨雾深处，远远地站着，像是在等着什么。你知道，自己已经被锁定了。之后无论你怎样遵守规则，公交都不会再为你停下。

        💀 结局：阴气锁定 · 公交永不停靠`,
                options: [
                    { text: '重新候车', next: 'start' }

            },

            act3: {
                id: 'act3',
                text: `那个穿雨衣的人刚走，站台的喇叭突然“滋啦”一声响了起来，把你吓了一跳。接着，一个冰冷的机械女声开始循环播报：“温馨提示，请 XX 乘客尽快前往站台中心认领遗失钱包。” 那念的正是你的全名！你下意识摸向背包夹层——钱包真的不见了。你心里一紧：什么时候丢的？难道刚才那个人……你正想迈步去找，忽然想起纸条上第三条：不要回应广播。你僵在原地，心里两个念头疯狂拉锯：钱包里有身份证和所有银行卡，丢了怎么办？可如果回应了广播，是不是就中了什么圈套？雨声哗哗，广播一遍遍重复，你的脚像钉在地上一样。`,
                options: [
                    { text: 'A. 低头看向地面，全程不动，完全无视广播', next: 'act3_a' },
                    { text: 'B. 转身走入雨雾，寻找刚才的陌生人求助', next: 'act3_b' },
                    { text: 'C. 离开原地，在站台四处翻找丢失的钱包', next: 'act3_c' }

            },
            act3_a: {
                id: 'act3_a',
                text: `你攥紧拳头，强迫自己低下头，盯着脚下的水洼，不去看任何地方。广播声越来越急促，像在催促你，但你纹丝不动。十几遍之后，声音突然断了，像磁带被强行扯断。你听到远处传来引擎的低吼——公交车来了。你松了一口气，知道自己赌对了。`,
                options: [
                    { text: '前往站台候车', next: 'act7' }
                ]
            },
            act3_b: {
                id: 'act3_b',
                text: `你咬了咬牙，决定去追那个陌生人——也许钱包就在他那里。你冲进雨雾，在站台尽头看见那个人背对着你，静立不动，周身缠绕着白雾。你走到他身后，他却始终没有回头。你心里发毛，但既然来了，只能硬着头皮继续。`,
                options: [
                    { text: '继续探查', next: 'act4' }
                ]
            },
            act3_c: {
                id: 'act3_c',
                text: `💀 你实在放心不下钱包，开始在站台各处翻找，长椅下、垃圾桶旁、广告牌后面……你找了很久，什么也没找到。广播声不知什么时候变成了冷笑，你心里一凉——你被判定为“自愿回应”，当晚所有 71 路直接绕行。你在雨中等了一夜，直到天亮，也没等到任何车。

        💀 结局：自愿滞留 · 被遗忘的站台`,
                options: [
                    { text: '重新候车', next: 'start' }
                ]
            },

            act4: {
                id: 'act4',
                text: `你站在那陌生人的背后，雨声几乎掩盖了一切，只有你粗重的呼吸声。他仍然背对着你，白雾从脚下升起，像活物一样缠绕着他的腿。你心里七上八下：要不要开口？还是继续等？这个人到底是不是活人？你想起纸条上的规则，但此刻你已经走入了支线，只能自己判断。`,
                options: [
                    { text: 'A. 开口呼唤对方，询问钱包下落', next: 'act4_a' },
                    { text: 'B. 安静站在一旁，等待对方主动转头', next: 'act4_b' },
                    { text: 'C. 伸手翻抢对方随身物品，试图拿回钱包', next: 'act4_c' }
                ]
            },
            act4_a: {
                id: 'act4_a',
                text: `💀 你终于忍不住喊了一声：“喂！我的钱包是不是在你那儿？”话音刚落，那人缓缓转过头来——你看到了一张苍白扭曲的脸，紧接着一股巨力将你拉入塌方幻境。你永久地背对站台，循环等候着那个永远不会回头的人。

        💀 结局：替换规则 · 永世背对`,

            },

                text: `你决定按兵不动，就这么站着。几秒钟后，那人开口了，声音像从水底传来：“我在……地下通道里捡到了你的钱包。你要不要……跟我去拿？”他侧过身，做出“请”的姿势。你犹豫了一下，心想：地下通道……规则说不到万不得已不要进去，但钱包在那里……你最终决定跟随。`,
                options: [
                    { text: '跟随前往', next: 'act5' }

            },
            act4_c: {

                id: 'act5',
                text: `你跟着那人来到地下通道入口，手机屏幕显示 01:10。距离凌晨一点封闭还有五十分钟。通道里涌出阵阵白雾，深处传来凌乱的脚步声，像是很多人同时在走动。那人站在入口处，回头示意你跟上。你心里打鼓：规则说非必要不要进通道，可钱包确实在里面……你站在台阶边缘，冷风从下面灌上来，你忍不住缩了缩脖子。`,

            act5_c: {
                id: 'act5_c',
                text: `💀 你站在台阶边缘，忍不住探头往里看。一股阴气顺着你的目光窜上来，你的影子开始疯狂扭动。你被阴气沾染，后续所有公交都会无视你。你在站台等到天亮，没有一辆车为你停下。

                text: `你站在站台上，心里只有一个念头——赶紧离开这个鬼地方。就在这时，两道车灯穿透雨雾，缓缓驶来。车头清晰地标着「71路」，你心里涌起一阵狂喜。车辆停稳开门，站台上的其他乘客开始向前挪动。你注意到队伍不算长，但想起了纸条上的第七条：不要抢先登车。你急得想跺脚，但又不敢第一个冲上去——可是如果上晚了，满载了怎么办？你心里七上八下。`,

        你紧跟司机身后，迈步走向出口标线。他周身的气场让所有黑影都不敢靠近。你跨过标线的一瞬间——雨夜、浓雾、黑影全部消散。你站在一条普通的街道上，路灯暖黄，远处传来早班的环卫车声。你低头看手机：02:23，雨停了。你回头，公交站静静立在街角，像一个普通的深夜站台。而你心里清楚，你刚刚从亡灵夹层里走了出来。

        // ================================================================
        //  🎮  游戏引擎（保持不变）
        // ================================================================

        let currentNodeId = 'start';
        const storyDisplay = document.getElementById('storyDisplay');
        const optionsContainer = document.getElementById('optionsContainer');
        const sceneIndicator = document.getElementById('sceneIndicator');
        const statusIndicator = document.getElementById('statusIndicator');

        function renderNode(nodeId) {
            const node = gameData[nodeId];
            if (!node) {
                storyDisplay.innerHTML = '<p>⚠️ 规则崩塌，世界紊乱。请刷新页面。</p>';
                optionsContainer.innerHTML = '';
                return;
            }

            let rawText = node.text;
            rawText = rawText.replace(/「(.*?)」/g, '<span class="hl-rule">「$1」</span>');
            rawText = rawText.replace(/✅/g, '<span class="hl-safe">✅</span>');
            rawText = rawText.replace(/💀/g, '<span class="hl-danger">💀</span>');
            rawText = rawText.replace(/✨/g, '<span class="hl-glow">✨</span>');
            rawText = rawText.replace(/⚠️/g, '<span class="hl-rule">⚠️</span>');

            const paragraphs = rawText.split(/\n\s*\n/).filter(p => p.trim() !== '');
            const htmlContent = paragraphs.map(p => `<p>${p.replace(/\n/g, ' ')}</p>`).join('');
            storyDisplay.innerHTML = htmlContent;

            const sceneName = node.id;
            let sceneLabel = '候车';
            let statusText = '观察';
            let statusClass = 'safety';

            if (sceneName.startsWith('act')) {
                const num = sceneName.replace('act', '').replace(/_[a-z]/, '');
                sceneLabel = `第${num}幕`;
            } else if (sceneName.startsWith('scene')) {
                const num = sceneName.replace('scene', '').replace(/_[a-z]/, '');
                sceneLabel = `场景${num}`;
            } else if (sceneName === 'start') {
                sceneLabel = '站台';
            } else if (sceneName === 'final_a') {
                sceneLabel = '🏆 完美结局';
            } else if (sceneName.includes('final') || sceneName.includes('end')) {
                sceneLabel = '结局';
            }

            if (rawText.includes('💀') && !rawText.includes('✅') && !rawText.includes('✨')) {
                statusText = '⚰️ 规则失效';
                statusClass = 'danger';
            } else if (rawText.includes('✨✨✨') || rawText.includes('完美通关')) {
                statusText = '🏆 生还';
                statusClass = 'escape';
            } else if (rawText.includes('✅') || rawText.includes('安全')) {
                statusText = '遵守规则';
                statusClass = 'safety';
            } else if (rawText.includes('⚠️') || rawText.includes('补救')) {
                statusText = '边缘试探';
                statusClass = 'safety';
            } else {
                statusText = '阅读规则';
                statusClass = 'safety';
            }

            sceneIndicator.textContent = sceneLabel;
            statusIndicator.textContent = statusText;
            statusIndicator.className = statusClass;

            optionsContainer.innerHTML = '';
            if (node.options && node.options.length > 0) {
                node.options.forEach((opt, index) => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.textContent = opt.text;
                    btn.addEventListener('click', function() {
                        if (gameData[opt.next]) {
                            currentNodeId = opt.next;
                            renderNode(currentNodeId);
                        } else {
                            currentNodeId = 'start';
                            renderNode('start');
                        }
                    });
                    if (index < 9) {
                        btn.setAttribute('data-key', index + 1);
                    }
                    optionsContainer.appendChild(btn);
                });
            } else {
                const resetBtn = document.createElement('button');
                resetBtn.className = 'option-btn';
                resetBtn.textContent = '重新开始';
                resetBtn.addEventListener('click', resetGame);
                optionsContainer.appendChild(resetBtn);
            }

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetGame() {
            currentNodeId = 'start';
            renderNode('start');
        }

        function showRules() {
            currentNodeId = 'start';
            renderNode('start');
        }

        document.addEventListener('keydown', (e) => {
            const key = parseInt(e.key);
            if (key >= 1 && key <= 9) {
                const btns = optionsContainer.querySelectorAll('.option-btn');
                if (btns[key - 1]) {
                    btns[key - 1].click();
                }
            }
            if (e.key === 'r' || e.key === 'R') {
                resetGame();
            }
        });

        renderNode('start');

        const storyEl = document.getElementById('storyDisplay');
        storyEl.addEventListener('wheel', (e) => {
            e.stopPropagation();
        }, { passive: true });
    </script>
