    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        .status-bar .money { color: #2e7d32; background: #e8f5e9; padding: 2px 12px; border-radius: 30px; }
        .status-bar .scene-label { color: #6a1b9a; }
        .story-text { color: #4a2c3a; font-size: 18px; line-height: 1.9; min-height: 180px; background: #fff8fa; padding: 20px 22px; border-radius: 20px; border-left: 6px solid #d81b60; margin-bottom: 28px; max-height: 520px; overflow-y: auto; box-shadow: inset 0 0 10px rgba(216,27,96,0.05); white-space: pre-wrap; word-break: break-word; }

        .options-grid { display: flex; flex-direction: column; gap: 12px; margin-bottom: 10px; }
        .option-btn { background: #fce4ec; border: 2px solid #f06292; color: #4a2c3a; padding: 14px 18px; border-radius: 30px; font-size: 16px; font-family: inherit; text-align: left; cursor: pointer; transition: all 0.2s; font-weight: bold; line-height: 1.4; }
        .option-btn:hover { background: #ff80ab; color: #fff; transform: scale(1.02); box-shadow: 0 4px 15px rgba(255,128,171,0.4); border-color: #d81b60; }
        .option-btn:active { transform: scale(0.97); }

<body>
    <div class="game-container" id="app">
        <div class="status-bar">
            <div>💪 猛男咖啡店</div>
            <div>场景: <span class="scene-label" id="sceneIndicator">门口</span></div>
            <div class="money">💰 <span id="budgetDisplay">150</span> 元</div>
        </div>
        <div class="story-text" id="storyDisplay"></div>
        <div class="options-grid" id="optionsContainer"></div>
        <div class="reset-area">
            <button class="reset-btn" onclick="resetGame()">⟳ 重新探店</button>
            <button class="reset-btn" onclick="showRules()">📜 再看守则</button>
        </div>
    </div>

    <script>
        // ================================================================
        //  猛男咖啡店 · 最终版（无正确/错误标注）
        // ================================================================

        let budget = 150;
        let bill = 0;
        let billItems = [];
        let currentNodeId = 'start';
        let prevNodeId = null;
        let coffeeAdded = false;

        function updateStatus() {
            document.getElementById('budgetDisplay').textContent = Math.max(0, budget);
        }

        function addBillItem(desc, amount) {
            if (amount === undefined || amount === 0) return;
            bill += amount;
            billItems.push({ desc: desc, amount: amount });
        }

        function resetGame() {
            budget = 150;
            bill = 0;
            billItems = [];
            coffeeAdded = false;
            prevNodeId = null;
            currentNodeId = 'start';
            updateStatus();
            renderNode('start');
        }

        function showRules() {
            if (currentNodeId === 'rules_display') return;
            prevNodeId = currentNodeId;
            currentNodeId = 'rules_display';
            renderNode('rules_display');
        }

        const gameData = {

            // ---------- 守则 ----------
            rules_display: {
                id: 'rules_display',
                text: `【猛男咖啡店 · 顾客守则】

        1. 不要直视任何店员的胸肌超过3秒，否则会收取“观赏费”（50元/次）。
        2. 点单时禁止说“随便”，否则会触发“主厨特制”（价格随机×10）。
        3. 店员对你笑的时候，必须微笑回应，否则会被登记为“冷漠顾客”（加收20元）。
        4. 餐具请按正确方式使用：叉子配蛋糕，勺子配汤品。用错会收取“餐具补习费”（30元/次）。
        5. 先喝咖啡，再吃甜品。顺序错了会收取“味觉混乱费”（15元/次）。
        6. 店员递物品时请双手接收，单手接会被视为“傲慢”（加收10元/次）。
        7. 结账时请不要看账单，直接刷卡。

        记住这些规则，它们会救你的命——或者送你进后厨。`,
                options: [ { text: '↩ 返回继续游戏', next: 'rules_back' } ]

            rules_back: { id: 'rules_back', text: '', options: [ { text: '继续', next: 'rules_restore' } ] },
            rules_restore: { id: 'rules_restore', text: '', options: [ { text: '继续', next: 'rules_go_back' } ] },

            // ---------- 主剧情 ----------

        你掏了掏口袋，只剩下150元——这是这个月最后的零花钱了。你决定只喝一杯咖啡，绝对不多花一分钱。

        你在APP上刷到一家“猛男咖啡店”——评分4.9分，评论不多，位置有点偏。

        “评分这么高，为什么没人来？”你嘀咕了一句，但腿实在太酸了，还是按照导航走了过去。

        你穿过两条小巷，拐过一个街角，终于在一栋老建筑的底层找到了它。门面不大，招牌上的字暗红暗红的。

        你推开门——门轴发出“吱呀”一声长响。

        店内空调开得很低，空气中弥漫着咖啡香。吧台后面站着三个身穿黑色紧身背心的猛男，肌肉线条在灯光下泛着光。

        中间那个立刻转过身来——他的脸上挂着一个灿烂的笑容，嘴角上扬到完美的弧度，露出一排白得反光的牙齿。

        他用一种过于阳光的语调说：“欢迎光临！小姐姐想坐哪里都可以哦！”

        声音很热情，但笑容……没有变过。你盯着他看了三秒，那个嘴角的弧度分毫未动，像画上去的。

        你打了个寒颤，移开目光。`,

        店员走过来，笑容灿烂：“小姐姐需要帮忙吗？”`,
                options: [

        // ================================================================
        //  渲染引擎
        // ================================================================

        function renderNode(nodeId) {
            const node = gameData[nodeId];
            if (!node) {
                document.getElementById('storyDisplay').innerHTML = '<p>⚠️ 咖啡店崩塌，请刷新。</p>';
                document.getElementById('optionsContainer').innerHTML = '';
                return;
            }

            if (nodeId === 'rules_back' || nodeId === 'rules_restore' || nodeId === 'rules_go_back') {
                if (prevNodeId && gameData[prevNodeId]) {
                    currentNodeId = prevNodeId;
                    prevNodeId = null;
                    renderNode(currentNodeId);
                } else {
                    currentNodeId = 'start';
                    renderNode('start');
                }
                return;
            }

            if ((nodeId === 'bill_check' || nodeId === 'early_bill_check') && !coffeeAdded) {
                addBillItem('咖啡', 68);
                coffeeAdded = true;
            }

            updateStatus();

            let rawText = node.text;
            rawText = rawText.replace(/「(.*?)」/g, '<span class="hl-rule">「$1」</span>');
            rawText = rawText.replace(/(\d+)元/g, '<span class="hl-money">$1元</span>');
            rawText = rawText.replace(/💀/g, '<span class="hl-danger">💀</span>');
            rawText = rawText.replace(/✨/g, '<span style="color:#d81b60;">✨</span>');

            if (nodeId === 'ending_bill_look') {
                let detailsHtml = '';
                if (billItems.length === 0) {
                    detailsHtml = '<span class="bill-item">（暂无费用）</span>';
                } else {
                    billItems.forEach(item => {
                        detailsHtml += `<span class="bill-item">${item.desc}：<span class="hl-money">${item.amount}元</span></span>`;
                    });
                }
                rawText = rawText.replace('[BILL_DETAILS]', detailsHtml);
                let total = bill;
                rawText = rawText.replace('<span class="hl-money" id="totalDisplay"></span>', `<span class="hl-money">${total}</span>`);
            }

            const paragraphs = rawText.split(/\n\s*\n/).filter(p => p.trim() !== '');
            const htmlContent = paragraphs.map(p => `<p>${p.trim()}</p>`).join('');
            document.getElementById('storyDisplay').innerHTML = htmlContent;

            const sceneName = node.id;
            let sceneLabel = '门口';
            if (sceneName === 'rules_display') sceneLabel = '守则';
            else if (sceneName.startsWith('seat')) sceneLabel = '选座';
            else if (sceneName.startsWith('muscle')) sceneLabel = '⚠️ 看胸肌';
            else if (sceneName.startsWith('bean') || sceneName.startsWith('roast') || sceneName.startsWith('flavor')) sceneLabel = '选豆';
            else if (sceneName.startsWith('order')) sceneLabel = '饮品';
            else if (sceneName.startsWith('dessert')) sceneLabel = '甜品';
            else if (sceneName.startsWith('utensil')) sceneLabel = '餐具';
            else if (sceneName.startsWith('smile')) sceneLabel = '微笑';
            else if (sceneName.startsWith('bill') || sceneName.startsWith('early')) sceneLabel = '结账';
            else if (sceneName.startsWith('ending')) sceneLabel = '结局';
            document.getElementById('sceneIndicator').textContent = sceneLabel;

            const container = document.getElementById('optionsContainer');
            container.innerHTML = '';
            if (node.options && node.options.length > 0) {
                node.options.forEach((opt) => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.textContent = opt.text;
                    btn.addEventListener('click', function() {
                        let target = opt.next;
                        if (opt.cost && opt.costDesc) {
                            addBillItem(opt.costDesc, opt.cost);
                        } else if (opt.cost && !opt.costDesc) {
                            addBillItem('费用', opt.cost);
                        }

                        if (target === 'ending_escape') {
                            if (bill > 150) {
                                target = 'ending_grind';
                            }
                        }

                        if (gameData[target]) {
                            currentNodeId = target;
                            renderNode(currentNodeId);
                        } else {
                            resetGame();
                        }
                    });
                    container.appendChild(btn);
                });
            } else {
                const resetBtn = document.createElement('button');
                resetBtn.className = 'option-btn';
                resetBtn.textContent = '重新开始';
                resetBtn.addEventListener('click', resetGame);
                container.appendChild(resetBtn);
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        resetGame();
    </script>
